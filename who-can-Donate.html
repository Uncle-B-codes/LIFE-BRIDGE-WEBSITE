<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Can Donate? (Trust Builder)</title>
    <style>
        body {
            background-color: #23272e;
            color: #f2f2f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 50px;
            margin: 0;
        }

        .content-container {
            max-width: 800px;
        }

        /* Main Page Heading */
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        /* Section Headings */
        h2 {
            font-size: 1.3rem;
            font-weight: 400;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
        }

        h2::before {
            content: "•";
            font-size: 1.6rem;
            margin-right: 0.8rem;
            vertical-align: middle;
        }

        /* Replaced .sub-item with .fact-line */
        .fact-line {
            display: block; /* Ensures it acts like a block element */
            font-size: 1.3rem;
            margin: 0 0 1rem 2.5rem;
            line-height: 1.4;
        }

        .fact-line::before {
            content: "○";
            margin-right: 0.8rem;
        }
    </style>
</head>
<body>

    <section class="content-container">
        <h1>5. WHO CAN DONATE? (Trust Builder)</h1>
        
        <section>
            <h2>Eligibility checklist:</h2>
            
            <!-- Changed tags and class names -->
            <span class="fact-line">Age 18+</span>
            <span class="fact-line">Good health</span>
            <span class="fact-line">Voluntary decision</span>
        </section>

        <section>
            <h2>Myths vs Facts table:</h2>
            
            <!-- Changed tags and class names -->
            <span class="fact-line">Myth: "Doctors won't save me if I'm a donor" -> Fact: Doctors save you first</span>
            <span class="fact-line">Myth: "My religion forbids it" -> Fact: Most religions support saving lives</span>
        </section>
        
    </section>

</body>
</html>
