<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Can Donate?</title>
    <style>
        body {
            background-color: #23272e;
            color: #f2f2f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 50px;
            margin: 0;
        }

        .content-container {
            max-width: 800px;
        }

        /* Main Page Heading */
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        /* Section Headings */
        h2 {
            font-size: 1.3rem;
            font-weight: 400;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
        }

        h2::before {
            content: "•";
            font-size: 1.6rem;
            margin-right: 0.8rem;
            vertical-align: middle;
        }
      
        ul {
            padding: 0;
            margin: 0;
        }

        li {
            list-style-type: none;
            font-size: 1.3rem;
            margin: 0 0 1rem 2.5rem;
            line-height: 1.4;
        }

        li::before {
            content: "○";
            margin-right: 0.8rem;
        }
    </style>
</head>

<body>

    <section class="content-container">
        <h1>WHO CAN DONATE?</h1>
        
        <section>
            <h2>Eligibility checklist:</h2>
            
            <ul>
              <li>Age 18+</li>
              <li>Good health</li>
              <li>Voluntary decision</li>
            </ul>
        </section>

        <section>
            <h2>Myths vs Facts:</h2>
            <ul>
              <li>Myth: "Doctors won't save me if I'm a donor" → Fact: Doctors save you first</li>
              <li>Myth: "My religion forbids it" → Fact: Most religions support saving lives</li>
            </ul>
        </section>
        
    </section>

</body>
</html>
