<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - LIFE BRIDGE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
         box-sizing: border-box;
        }
      
        body{
            font-family: Arial, sans-serif;
            background-color:white;
            margin:0;
            padding:40px;
            color:#111;
        }

        .form-container{
            width: 90%;
            max-width: 450px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }
        h1{
            text-align:center;
            color:darkgreen;
        }

        label{
            display:block;
            margin-top:12px;
            font-weight:bold;
            color:black;
        }

        input,
        select{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        #registerButton{
            width:100%;
            margin-top:20px;
            padding:12px;
            background-color:darkgreen;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:1rem;
            transition:opacity 0.3s ease;
        }

        #registerButton:hover{opacity:0.75;}
        #registerButton:active{opacity:0.6;}
        #registerButton:disabled{
            opacity:0.5;cursor:not-allowed;
        }

        .success{
            display:none;
            color:green;
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        }
        .success.is-visible{display:block;}

        @media (max-width: 600px) {

            body { 
               padding:15px;
            }
            .form-container {
                width: 100%;
                padding: 20px; 
            }
            h1 {
                font-size: 24px;
            }

            input,
            select,
              #registerbutton{
                padding: 16px;
            }
       
        }

    </style>
</head>
<body>
    <div id="header"></div>
    <div id="navbar"></div>

    <main class="form-container">

        <h1>Donor Registration</h1>

        <form onsubmit="registerDonor(event)">

            <label>Full Name
                <input type="text" required>
            </label>

            <label>Email Address
                <input type="email" required>
            </label>

            <label>Phone Number
                <input type="tel" required>
            </label>

            <label>Age
                <input type="number" min="18", max="100" required>
            </label>

            <label>Blood Group
                <input type="text required"
            </label>

            <select required>
                <option>Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <label>Organ Willing To Donate</label>

            <select required>
                <option>Select Organ</option>
                <option>Kidney</option>
                <option>Liver</option>
                <option>Heart</option>
                <option>Lungs</option>
                <option>Pancreas</option>
                <option>Cornea</option>
            </select>

            <label>
                <input type="checkbox" required>
                I consent to organ donation registration.
            </label>

            <button type="submit" id="registerButton">
                Register As Donor
            </button>

        </form>

        <p class="success" id="successMessage">
            Registration Successful!
        </p>

    </div>

    <script>

        function registerDonor(event){

            event.preventDefault();

            document.getElementById("successMessage").style.display="block";
        }

    </script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
<div id="footer"></div>       
</body>
</html>
