<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - LIFE BRIDGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
   
    <style>
        body { font-family: Arial, sans-serif; background-color: white; color: #12372A; }
        
        
        label{ 
               color: black;
        }
       .form-control{
          background-color: lightgray;
          color: black;
          border: 1px solid black;
        }
    </style>
    </head>
    <body>
        <div id="header"></div>
        <div id="navbar"></div>
        
    <h1 style="text-align: center; padding:30px;">Have questions about organ donation?</h1>
    <h2 style="text-align: center; padding:0px;">Get in Touch!</h2>  
    <h4 style="text-align: center; padding:0px;">We'd love to hear from you</h4>

<div class="container my-5">
  <div class="row">
    
    <div class="col-md-5 mb-4">
      <h2>Contact Details</h2>
      <p>Feel free to reach out via phone, WhatsApp, or social media.</p>
      <ul class="list-unstyled">
        <li class="mb-2"><strong>Phone:</strong> <a href="tel:+256745635953">+256 745 635953</a></li>
        <li class="mb-2"><strong>WhatsApp:</strong> <a href="https://wa.me/256745635953" target="_blank">Chat with us Now! (0745635953)</a></li>
        <li class="mb-2"><strong>Email:</strong> <a href="mailto:lifebridgeuganda@gmail.com">Send Email (lifebridgeuganda@gmail.com)</a></li>
      </ul>
    </div>
    
    
    <div class="col-md-7">
      <h2>Send a Message</h2>
      <form id="contactForm">
        <div class="mb-3">
          <label for="userName" class="form-label">Name</label>
          <input type="text" class="form-control" id="userName" required>
        </div>
        <div class="mb-3">
          <label for="userEmail" class="form-label">Email address</label>
          <input type="email" class="form-control" id="userEmail" required>
        </div>
        <div class="mb-3">
          <label for="userMessage" class="form-label">Message</label>
          <textarea class="form-control" id="userMessage" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Message</button>
      </form>
    </div>
  </div>
</div>

<div id="footer"></div>     
<script src="load-components.js"></script>
    </body>
</html>
